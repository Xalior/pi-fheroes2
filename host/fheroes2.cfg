# fheroes2 settings for the bare-metal Raspberry Pi build.
#
# The game rewrites this file whenever it exits, so what is here is the
# STARTING POINT rather than a permanent setting. Everything below is either
# a fact about this board or a first-run choice, and each says which.
#
# Anything the game understands and this file does not mention keeps the
# game's own default.

# The resolution. It is not a preference here: the board declares one display
# to the SDL layer before the game starts, and this is that display. 640x480
# is what Heroes II was drawn for and what fheroes2 calls its own default.
videomode = 640x480:640x480

# There is one display and it fills the screen. There is no windowed mode on
# a board with no window manager.
fullscreen = on

# Frames are put on screen by the framebuffer's page flip, which happens on
# the display's own refresh whether or not this is on. Left on so the setting
# describes what actually happens.
v-sync = on

# Nearest-neighbour scaling. The SDL layer scales every frame to the attached
# screen with nearest neighbour and nothing else — asking for linear here
# would name a filter that does not exist and would not be applied.
screen scaling type = nearest

# SOUND IS NOT AVAILABLE ON THIS BOARD. Heroes II's music is MIDI and its
# sound effects are mixed by SDL_mixer, which is a separate library from SDL2
# and which circle-libsdl2 does not provide. The game reports this on the
# serial console at startup and runs in silence. Both volumes are set to zero
# so no part of the interface offers a level that cannot be heard.
sound volume = 0
music volume = 0

# Skip the introduction videos. They are Smacker files from the original
# game's data, and playing them costs a minute before the first menu on a
# board that is most often being watched for whether it started at all. Turn
# it on once the game is running to your satisfaction.
show game intro = off

# The frame rate and memory readout in the corner of the screen. Off, because
# the serial console reports the same numbers with `rapi-perf` and does not
# cover the picture to do it.
system info = off

# Skip the first-run dialogue. On a fresh configuration fheroes2 asks the
# player to pick a language and a resolution before the main menu. There is
# one resolution on this board and the question has one answer, so the
# dialogue is a screen the player cannot usefully change anything on.
first time game run = off
